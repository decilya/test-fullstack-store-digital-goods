services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gamer-store-php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html/backend
      - ./frontend:/var/www/html/frontend
    networks:
      - gamer-store-network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: gamer-store-nginx
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./backend:/usr/share/nginx/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_healthy
    networks:
      - gamer-store-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  gamer-store-network:
    driver: bridge
